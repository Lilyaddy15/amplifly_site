[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# No catch-all rewrite: this is a static multi-page site, not an SPA. Unknown URLs must return a
# real 404 (dist/404.html, which Netlify serves automatically) so search engines don't index
# every typo as a copy of the homepage.
